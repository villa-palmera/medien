name: Story bauen
on:
  schedule:
    - cron: "23 7,11,15 * * *"   # UTC → 09:23, 13:23, 17:23 Uhr (Sommerzeit)
  workflow_dispatch:
    inputs:
      post_id:
        description: "Instagram-Beitrags-ID (leer = neuester ohne Story)"
        required: false
permissions:
  contents: write
concurrency: story
jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null && pip install -q pillow
      - name: Story bauen
        env:
          POST_ID: ${{ github.event.inputs.post_id }}
        run: python3 scripts/story.py
      - name: Hochladen
        run: |
          git config user.name "villa-palmera-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories
          git diff --cached --quiet && echo "Nichts Neues" || (git commit -m "Story automatisch gebaut" && git push)
